<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <!-- Ombreggiatura morbida per dare profondità alle matrioske -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- NESSUN RECT DI SFONDO: TRASPARENTE -->

  <!-- ========================================== -->
  <!-- LEVEL 1: MATRIOSKA ESTERNA - IL DATABASE   -->
  <!-- ========================================== -->
  <g filter="url(#drop-shadow)">
    <!-- Sagoma Matrioska Esterna -->
    <path d="M 250 30 
             C 305 30, 340 65, 340 120 
             C 340 155, 315 180, 310 200 
             C 390 250, 410 360, 410 440 
             C 410 520, 340 550, 250 550 
             C 160 550, 90 520, 90 440 
             C 90 360, 110 250, 190 200 
             C 185 180, 160 155, 160 120 
             C 160 65, 195 30, 250 30 Z" 
          fill="#1E293B" stroke="#38BDF8" stroke-width="4"/>
    
    <!-- TESTA 1: CILINDRO DATABASE SQL -->
    <g transform="translate(250, 115)">
      <!-- Cilindro SQL Base -->
      <path d="M -30 -15 L -30 15 C -30 25, 30 25, 30 15 L 30 -15" fill="none" stroke="#38BDF8" stroke-width="3.5"/>
      <path d="M -30 -0 C -30 10, 30 10, 30 -0" fill="none" stroke="#38BDF8" stroke-width="3"/>
      <ellipse cx="0" cy="-15" rx="30" ry="10" fill="#0F172A" stroke="#38BDF8" stroke-width="3.5"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- LEVEL 2: MATRIOSKA INTERMEDIA - LA TABELLA -->
  <!-- ========================================== -->
  <g filter="url(#drop-shadow)">
    <!-- Sagoma Matrioska Intermedia -->
    <path d="M 250 180 
             C 290 180, 315 205, 315 240 
             C 315 265, 298 282, 294 295 
             C 350 330, 365 405, 365 460 
             C 365 515, 315 530, 250 530 
             C 185 530, 135 515, 135 460 
             C 135 405, 150 330, 206 295 
             C 202 282, 185 265, 185 240 
             C 185 205, 210 180, 250 180 Z" 
          fill="#0284C7" stroke="#7DD3FC" stroke-width="3"/>

    <!-- TESTA 2: ICONA SCHEMA / STRUTTURA -->
    <g transform="translate(250, 238)">
      <circle cx="0" cy="0" r="22" fill="#0369A1"/>
      <!-- Icona Tabella / Griglia Schema -->
      <rect x="-11" y="-11" width="22" height="22" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="-11" y1="-3" x2="11" y2="-3" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="-3" y1="-3" x2="-3" y2="11" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- BUSTO 2: GRIGLIA TABELLA DATI (RIGHE E COLONNE) -->
    <g transform="translate(250, 370)">
      <!-- Sfondo Scheda Tabella -->
      <rect x="-85" y="-55" width="170" height="100" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" opacity="0.95"/>
      
      <!-- Header Tabella -->
      <path d="M -85 -47 C -85 -51, -81 -55, -77 -55 L 77 -55 C 81 -55, 85 -51, 85 -47 L 85 -25 L -85 -25 Z" fill="#0369A1"/>
      <circle cx="-70" cy="-40" r="3.5" fill="#38BDF8"/>
      <rect x="-60" y="-43" width="50" height="6" rx="3" fill="#FFFFFF"/>
      
      <!-- Righe della Tabella SQL -->
      <!-- Riga 1 (PK Highlighted) -->
      <rect x="-75" y="-17" width="150" height="16" rx="4" fill="#1E293B"/>
      <circle cx="-65" cy="-9" r="3" fill="#F59E0B"/> <!-- PK Icon Dot -->
      <rect x="-55" y="-12" width="45" height="6" rx="3" fill="#38BDF8"/>
      <rect x="0" y="-12" width="30" height="6" rx="3" fill="#94A3B8"/>
      <rect x="40" y="-12" width="25" height="6" rx="3" fill="#94A3B8"/>

      <!-- Riga 2 -->
      <line x1="-75" y1="7" x2="75" y2="7" stroke="#334155" stroke-width="1.5"/>
      <rect x="-55" y="1" width="35" height="6" rx="3" fill="#64748B"/>
      <rect x="0" y="1" width="45" height="6" rx="3" fill="#64748B"/>

      <!-- Riga 3 -->
      <line x1="-75" y1="25" x2="75" y2="25" stroke="#334155" stroke-width="1.5"/>
      <rect x="-55" y="19" width="50" height="6" rx="3" fill="#64748B"/>
      <rect x="10" y="19" width="30" height="6" rx="3" fill="#64748B"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- LEVEL 3: MATRIOSKA INTERNA - IL CAMPO/PK   -->
  <!-- ========================================== -->
  <g filter="url(#drop-shadow)">
    <!-- Sagoma Matrioska Interna -->
    <path d="M 250 360 
             C 275 360, 290 375, 290 395 
             C 290 410, 280 420, 277 430 
             C 310 450, 320 495, 320 515 
             C 320 525, 290 530, 250 530 
             C 210 530, 180 525, 180 515 
             C 180 495, 190 450, 223 430 
             C 220 420, 210 410, 210 395 
             C 210 375, 225 360, 250 360 Z" 
          fill="#F59E0B" stroke="#FDE047" stroke-width="2.5"/>

    <!-- TESTA 3: ICONA CHIAVE PRIMARIA (PK) -->
    <g transform="translate(250, 398)">
      <circle cx="0" cy="0" r="14" fill="#D97706"/>
      <!-- Icona Chiave SQL -->
      <circle cx="-3" cy="-3" r="4.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M 0 0 L 6 6 M 4 4 L 6 2 M 5 5 L 7 3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- BUSTO 3: NODO CAMPO E VALORE / RELAZIONE -->
    <g transform="translate(250, 475)">
      <!-- Scheda Campo Selezionato -->
      <rect x="-45" y="-28" width="90" height="42" rx="6" fill="#0F172A" stroke="#FDE047" stroke-width="2"/>
      
      <!-- Label Campo -->
      <text x="0" y="-12" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
        ID_COLUMN
      </text>
      
      <!-- Grafico di Relazione / Connessione dei Dati -->
      <line x1="-25" y1="6" x2="25" y2="6" stroke="#64748B" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="-25" cy="6" r="4" fill="#38BDF8"/>
      <circle cx="0" cy="6" r="4" fill="#F59E0B"/>
      <circle cx="25" cy="6" r="4" fill="#10B981"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- TYPOGRAPHY: MATRIOSGA                      -->
  <!-- ========================================== -->
  <text x="250" y="585" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="26" font-weight="800" letter-spacing="6" text-anchor="middle">
    MATRIOSGA
  </text>
</svg>
